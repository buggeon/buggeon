schema:
  - internal/graph/*.graphqls

exec:
  package: graph
  layout: single-file
  filename: internal/graph/generated.go

resolver:
  package: graph
  layout: follow-schema
  dir: internal/graph
  filename_template: "{name}.resolvers.go"

model:
  filename: internal/graph/gqlinput/gqlinput_gen.go
  package: gqlinput

call_argument_directives_with_null: true

models:
  Project:
    model:
      - buggeon/internal/graph/gqlmodel.Project

  Member:
    model:
      - buggeon/internal/graph/gqlmodel.Member

  Board:
    model:
      - buggeon/internal/graph/gqlmodel.Board

  Card:
    model:
      - buggeon/internal/graph/gqlmodel.Card

  Message:
    model:
      - buggeon/internal/graph/gqlmodel.Message

  User:
    model:
      - buggeon/internal/graph/gqlmodel.User

  Schema:
    model:
      - buggeon/internal/graph/gqlmodel.Schema

  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int32
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
